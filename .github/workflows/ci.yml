name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # номер сборки = число коммитов

      - name: Версии инструментов
        run: |
          sw_vers
          swiftc --version
          xcrun --show-sdk-path

      - name: Тесты
        run: scripts/test.sh

      - name: Сборка (Apple Silicon + Intel)
        env:
          ARCHS: arm64 x86_64
        run: ./build.sh

      - name: Проверка бандла
        run: |
          lipo -info build/Peppap.app/Contents/MacOS/Peppap
          codesign --verify --deep --strict build/Peppap.app
          plutil -lint build/Peppap.app/Contents/Info.plist

      - name: Упаковка
        run: scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Peppap-${{ github.sha }}
          path: dist/*
          retention-days: 14

  cask:
    name: Homebrew cask
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tap из этого репозитория
        run: brew tap dongaber/peppap "$GITHUB_WORKSPACE"

      - name: Audit
        run: brew audit --cask --online dongaber/peppap/peppap

      - name: Установка и удаление
        run: |
          brew install --cask dongaber/peppap/peppap
          test -d /Applications/Peppap.app
          if xattr /Applications/Peppap.app | grep -q com.apple.quarantine; then
            echo "::error::Карантин не снят"; exit 1
          fi
          brew uninstall --cask dongaber/peppap/peppap
