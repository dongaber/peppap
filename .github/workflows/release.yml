name: Release

# Запускается тегом vX.Y.Z или vX.Y.Z-beta.N (его создаёт `bun run release`).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Версия из тега совпадает с package.json
        run: |
          . scripts/lib.sh
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(app_version)"
          echo "Тег: $TAG, package.json: $FILE"
          [ "$TAG" = "$FILE" ] || { echo "::error::Тег v$TAG не совпадает с package.json ($FILE)"; exit 1; }
          echo "VERSION=$FILE" >> "$GITHUB_ENV"
          # 0.6.0-beta.1 — пререлиз: не «latest» для автообновления и без обновления cask.
          case "$FILE" in *-*) echo "PRERELEASE=true" ;; *) echo "PRERELEASE=false" ;; esac >> "$GITHUB_ENV"

      - name: Тесты
        run: scripts/test.sh

      - name: Сборка (Apple Silicon + Intel)
        env:
          ARCHS: arm64 x86_64
        run: ./build.sh

      - name: Упаковка
        run: scripts/package.sh

      - name: Заметки к релизу из CHANGELOG
        run: |
          scripts/changelog-section.sh "$VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ---

          **Install:** `brew install --cask dongaber/peppap/peppap`, or download the `.dmg` and drag Peppap to Applications.
          The app is not notarized, so on first launch run:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Peppap.app
          ```

          or open it via System Settings → Privacy & Security → Open Anyway.
          NOTES
          cat notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Peppap $VERSION" \
            --notes-file notes.md \
            --verify-tag $FLAGS

      - name: Обновление Homebrew tap
        if: env.PRERELEASE == 'false'
        env:
          # Deploy key с правом записи в dongaber/homebrew-peppap.
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          SHA=$(shasum -a 256 "dist/Peppap-$VERSION.zip" | awk '{print $1}')
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:dongaber/homebrew-peppap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/peppap.rb
          if git diff --quiet; then echo "Cask уже актуален"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "peppap $VERSION"
          git push origin HEAD
