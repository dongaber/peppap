name: Release

# Запускается тегом vX.Y.Z (его создаёт scripts/release.sh).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Версия из тега совпадает с VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d ' \n' < VERSION)"
          echo "Тег: $TAG, VERSION: $FILE"
          [ "$TAG" = "$FILE" ] || { echo "::error::Тег v$TAG не совпадает с VERSION ($FILE)"; exit 1; }
          echo "VERSION=$FILE" >> "$GITHUB_ENV"

      - name: Сборка (Apple Silicon + Intel)
        env:
          ARCHS: arm64 x86_64
        run: ./build.sh

      - name: Упаковка
        run: scripts/package.sh

      - name: Заметки к релизу из CHANGELOG
        run: |
          scripts/changelog-section.sh "$VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ---

          **Install:** download the `.dmg` and drag Peppap to Applications.
          The app is not notarized, so on first launch run:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Peppap.app
          ```

          or open it via System Settings → Privacy & Security → Open Anyway.
          NOTES
          cat notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Peppap $VERSION" \
            --notes-file notes.md \
            --verify-tag
